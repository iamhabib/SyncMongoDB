# Each install lives in its own folder (e.g. /var/www/db-retail, /var/www/db-pass).
# Compose project name defaults to the directory name, so containers won't clash.
# Only host ports (LOCAL_MONGO_PORT, SYNC_AGENT_PORT) must differ across installs on the same EC2.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      # Unique per install on this EC2. Restrict source IPs via Security Group.
      - "${LOCAL_MONGO_PORT:?Set LOCAL_MONGO_PORT in .env}:27017"
    volumes:
      - ./data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${LOCAL_MONGO_ROOT_USER:?Set LOCAL_MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${LOCAL_MONGO_ROOT_PASSWORD:?Set LOCAL_MONGO_ROOT_PASSWORD in .env}
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "-u", "${LOCAL_MONGO_ROOT_USER}", "-p", "${LOCAL_MONGO_ROOT_PASSWORD}", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  sync:
    build:
      context: ./mongodb-sync
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      LOCAL_MONGO_URL: mongodb://${LOCAL_MONGO_ROOT_USER}:${LOCAL_MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE_NAME:?Set MONGO_DATABASE_NAME in .env}?authSource=admin
      HEALTH_BIND_HOST: 0.0.0.0
      SYNC_AGENT_PORT: ${SYNC_AGENT_PORT:?Set SYNC_AGENT_PORT in .env}
    ports:
      - "127.0.0.1:${SYNC_AGENT_PORT}:${SYNC_AGENT_PORT}"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://127.0.0.1:' + (process.env.SYNC_AGENT_PORT || 3000) + '/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          memory: 512M
