services:
  # Local MongoDB — the sync target. Atlas Change Streams write here.
  mongo:
    image: ${MONGO_IMAGE:-mongo:7}
    container_name: mongo-sync-target
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCAL_MONGO_PORT:-27017}:27017"
    volumes:
      - ./DATA_SOURCE:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${LOCAL_MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${LOCAL_MONGO_ROOT_PASSWORD:-securepassword}
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "-u", "${LOCAL_MONGO_ROOT_USER:-admin}", "-p", "${LOCAL_MONGO_ROOT_PASSWORD:-securepassword}", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Oplog-inspired sync service: Atlas Change Streams -> local Mongo
  sync:
    build:
      context: ./mongodb-sync
    container_name: mongodb-oplog-sync
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      LOCAL_MONGO_URL: mongodb://${LOCAL_MONGO_ROOT_USER:-admin}:${LOCAL_MONGO_ROOT_PASSWORD:-securepassword}@mongo:27017/${MONGO_DATABASE_NAME:-sync_db}?authSource=admin
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./LOGS:/app/logs
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.PORT || 3000) + '/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 512M


